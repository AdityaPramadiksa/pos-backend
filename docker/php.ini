; Foto menu & nota beberapa MB, APK aplikasi kasir sekitar 60 MB
upload_max_filesize = 160M
post_max_size = 170M
; Unggahan APK lewat koneksi lambat bisa beberapa menit
max_input_time = 600
max_execution_time = 120
memory_limit = 256M
expose_php = Off
date.timezone = Asia/Makassar

opcache.enable = 1
opcache.memory_consumption = 64
opcache.validate_timestamps = 0
